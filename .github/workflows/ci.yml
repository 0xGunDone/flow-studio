name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: npm ci
        working-directory: app
      - name: Test desktop and MCP
        run: npm test
        working-directory: app
      - name: Test Chrome extension
        run: node --test extension/tests/*.test.cjs
      - name: Check release sources
        run: node scripts/check-release.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test backend session, transport and generation behavior
        working-directory: backend
        run: |
          for suite in test_session_check test_plugin_session_import test_unavailable_accounts test_flow_frontend_transport test_video_asset_resolution test_video_poll_credentials test_flow_image_generation_args; do
            python -m unittest discover -s tests -p "${suite}.py" -v
          done
      - name: Test backend model UI
        run: node --test backend/tests/test_ui_models.cjs
